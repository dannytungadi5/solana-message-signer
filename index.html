<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Solana Message Signer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #101216; color: #f2f3f5; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16px; line-height: 1.55; }
  main { max-width: 620px; margin: 0 auto; padding: 22px 16px 48px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p.sub { color: #b9bec9; margin: 0 0 18px; font-size: 14px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: 14px; }
  textarea { width: 100%; min-height: 130px; background: #1a1d24; color: #f2f3f5; border: 1px solid #333947; border-radius: 10px; padding: 10px 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  button { display: block; width: 100%; margin: 14px 0 0; padding: 13px; border: 0; border-radius: 10px; background: #2fbf8f; color: #06130e; font-size: 16px; font-weight: 700; cursor: pointer; }
  button.ghost { background: #22262f; color: #f2f3f5; border: 1px solid #333947; }
  .box { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 14px; }
  .hidden { display: none; }
  #status { background: #1a1d24; border: 1px solid #333947; word-break: break-all; }
  #sigBox { background: #123528; border: 1px solid #2fbf8f; word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  #errBox { background: #3a1d1d; border: 1px solid #8a3b3b; color: #ffb4b4; }
  .warn { background: #38300f; border: 1px solid #8a742a; color: #ffe08a; }
</style>
</head>
<body>
<main>
  <h1>Solana Message Signer</h1>
  <p class="sub">Signs a plain-text message with your Phantom wallet, off-chain. No transaction, no fee. This page runs fully on your device and sends nothing anywhere.</p>

  <div id="noPhantom" class="box warn hidden">Phantom was not found. Open this page inside the Phantom app's browser (or on a browser with the Phantom extension).</div>

  <button id="connectBtn" type="button">1. Connect Phantom</button>
  <div id="status" class="box hidden"></div>

  <label for="msg">2. Paste the exact message to sign</label>
  <textarea id="msg" spellcheck="false" placeholder="Paste the message exactly as you received it"></textarea>

  <button id="signBtn" type="button">3. Sign message</button>

  <div id="errBox" class="box hidden"></div>
  <div id="sigBox" class="box hidden"></div>
  <button id="copyBtn" type="button" class="ghost hidden">Copy signature</button>
</main>
<script>
(function () {
  "use strict";
  var AL = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
  function b58encode(bytes) {
    var zeros = 0, i;
    while (zeros < bytes.length && bytes[zeros] === 0) zeros++;
    var digits = [0];
    for (i = zeros; i < bytes.length; i++) {
      var carry = bytes[i];
      for (var j = 0; j < digits.length; j++) { carry += digits[j] << 8; digits[j] = carry % 58; carry = (carry / 58) | 0; }
      while (carry) { digits.push(carry % 58); carry = (carry / 58) | 0; }
    }
    var out = "";
    for (i = 0; i < zeros; i++) out += "1";
    for (i = digits.length - 1; i >= 0; i--) out += AL[digits[i]];
    return out;
  }
  function provider() {
    if (window.solana && typeof window.solana.signMessage === "function") return window.solana;
    if (window.phantom && window.phantom.solana && typeof window.phantom.solana.signMessage === "function") return window.phantom.solana;
    return null;
  }
  var connectBtn = document.getElementById("connectBtn");
  var signBtn = document.getElementById("signBtn");
  var copyBtn = document.getElementById("copyBtn");
  var status = document.getElementById("status");
  var sigBox = document.getElementById("sigBox");
  var errBox = document.getElementById("errBox");
  var noPhantom = document.getElementById("noPhantom");
  var msgEl = document.getElementById("msg");
  var connected = null;

  if (!provider()) noPhantom.classList.remove("hidden");

  function showError(t) { errBox.textContent = t; errBox.classList.remove("hidden"); }
  function clearError() { errBox.classList.add("hidden"); errBox.textContent = ""; }

  connectBtn.addEventListener("click", async function () {
    clearError();
    var p = provider();
    if (!p) { noPhantom.classList.remove("hidden"); return; }
    try {
      var resp = await p.connect();
      connected = (resp && resp.publicKey ? resp.publicKey : p.publicKey).toString();
      status.textContent = "Connected wallet: " + connected + " - check this is the wallet you mean to sign with.";
      status.classList.remove("hidden");
    } catch (e) {
      showError("Connection was cancelled or failed: " + (e && e.message ? e.message : e));
    }
  });

  signBtn.addEventListener("click", async function () {
    clearError(); sigBox.classList.add("hidden"); copyBtn.classList.add("hidden");
    var p = provider();
    if (!p) { noPhantom.classList.remove("hidden"); return; }
    if (!connected) { showError("Connect Phantom first (step 1)."); return; }
    var msg = msgEl.value;
    if (!msg || !msg.trim()) { showError("Paste the message to sign first (step 2)."); return; }
    try {
      var encoded = new TextEncoder().encode(msg);
      var resp = await p.signMessage(encoded, "utf8");
      var sigBytes = resp && resp.signature ? resp.signature : resp;
      var sig = b58encode(new Uint8Array(sigBytes));
      sigBox.textContent = "Signature: " + sig;
      sigBox.classList.remove("hidden");
      copyBtn.classList.remove("hidden");
    } catch (e) {
      showError("Signing was cancelled or failed: " + (e && e.message ? e.message : e));
    }
  });

  copyBtn.addEventListener("click", async function () {
    var sig = sigBox.textContent.replace(/^Signature:\s*/, "");
    try { await navigator.clipboard.writeText(sig); copyBtn.textContent = "Copied"; }
    catch (e) { copyBtn.textContent = "Select and copy the signature above"; }
  });
})();
</script>
</body>
</html>
